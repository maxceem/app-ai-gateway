  <text
    x="16"
    y="17"
    fill="#ffffff"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="0.2"
    text-anchor="middle"
    dominant-baseline="central"
  >AI</text>
</svg>
