# Releases everything a version consists of, triggered by a pushed `vX.Y.Z` tag.
#
# The trigger is the tag and never a changed file. A version field can be edited
# by anyone who opens a pull request, so a release keyed on one would be a
# release strangers can start; creating a `v*` tag is restricted to the project owner
# by a repository ruleset, and `.github/workflows/ci.yml` refuses a pull request
# that edits a version field at all. The tag also names exactly one commit, so a
# re-run releases the same tree rather than whatever main has reached since.
#
# The project owner cuts a release with `pnpm run release <version>` (scripts/release.mjs),
# which bumps both manifests, commits, tags and pushes the two together.
#
# Every job gets only the secret it needs, so a package that misbehaves in one
# job never sees another job's secret. `build` installs every dependency and
# builds, with no secret and read-only access: the gateway archive and the CLI
# package, the Worker and console the hosted gateway deploys
# (scripts/build-prebuilt.mjs), and the documentation site. The jobs after it
# take nothing from `build` but those built files, and their scripts, Wrangler
# configuration and D1 migrations come from the tag's checkout. Jobs that run
# Wrangler install only it and its config reader, from deploy/'s own lockfile
# and without install scripts.
#
#   job               secret                          permissions        after
#   verify            none                            contents: read     -
#   build             none                            contents: read     -
#   deploy-gateway    Cloudflare token, account,      contents: read     verify, build
#                     gateway overlay (production)
#   deploy-docs       docs Cloudflare token, account, contents: read     deploy-gateway
#                     docs overlay (docs)
#   publish-archive   GitHub token                    contents: write    deploy-gateway
#   publish-npm       npm identity by OIDC (release)  id-token: write    publish-archive
#   post-deploy-check POST_DEPLOY_CHECK_TOKEN         none               deploy-gateway
#                     (notify)
#   follow-prices     GitHub token                    actions: write     deploy-gateway,
#                                                                        deploy-docs,
#                                                                        publish-archive,
#                                                                        publish-npm
#   refresh-context7  CONTEXT7_API_KEY (notify)       none               deploy-docs
#
# Every job after `build` downloads the one artifact `build` uploaded, by its
# id, so no other upload with the same name can take its place.
#
# The order keeps today's gates:
#   - the gateway job checks its configuration with a dry run before it
#     deploys, and nothing is published before that dry run and deploy succeed;
#     the docs job also checks its own configuration before deploying;
#   - the gateway archive is on the GitHub release before the CLI reaches npm,
#     because an installed CLI refuses to run until it can download exactly
#     that archive;
#   - main's price list is deployed, when it is newer, only after the gateway,
#     the docs, the archive and npm all succeeded;
#   - the post-deploy check and the Context7 refresh are best effort and never
#     fail the release.
#
# Environments. Each admits `v*` tags only, and only the project owner can
# create those. A repository secret would be handed to any workflow on any
# branch a writer pushes; an environment secret only to a job the environment
# admits.
#   production  holds the Cloudflare token the gateway deploy needs. It holds
#               each run until the project owner approves it, with no admin
#               bypass. Only `deploy-gateway` uses it, so one approval covers a
#               release, and every later job runs only after that job
#               succeeded.
#   docs        holds a Cloudflare token that can edit only the docs Worker,
#               with no D1, R2 or gateway access. No reviewer: its job runs after the approved
#               gateway deploy.
#   release     holds no secret. It is what npm's trusted publisher names, so
#               only `publish-npm` can publish the CLI. No reviewer, for the
#               same reason.
#   notify      holds the two low-value tokens that tell outside services a
#               release happened. Its jobs run no package installs. No
#               reviewer. The prices deploy (.github/workflows/deploy-prices.yml)
#               uses it for its post-deploy check too.
#
# `production` environment secrets, required:
#   CLOUDFLARE_API_TOKEN         D1: Edit, Workers Scripts: Edit and Workers R2 Storage: Edit
#                                on the account, and Workers Routes: Edit on the zone
#   CLOUDFLARE_ACCOUNT_ID        the account both Workers live in
#   WRANGLER_CLOUD_OVERLAY       contents of wrangler.cloud.overlay.jsonc; it may not
#                                change how the Worker is built (`BUILD_KEYS` in
#                                scripts/wrangler-config.mjs), since `build` builds
#                                from wrangler.jsonc alone
# `docs` environment secrets, required:
#   DOCS_CLOUDFLARE_API_TOKEN    edit access to the docs Worker only, plus what the
#                                docs overlay's route or custom domain needs on its
#                                zone; no D1, no R2
#   CLOUDFLARE_ACCOUNT_ID        the same account
#   DOCS_WRANGLER_CLOUD_OVERLAY  contents of docs/wrangler.cloud.overlay.jsonc
# `notify` environment secrets, optional:
#   CONTEXT7_API_KEY             Context7 API key; unset, Context7 is not asked to
#                                refresh the documentation
#   POST_DEPLOY_CHECK_TOKEN      bearer token for POST_DEPLOY_CHECK_URL
# Repository variables, optional:
#   DOCS_SITE_SCRIPT             JavaScript built into every documentation page,
#                                such as analytics tags; unset, the documentation
#                                carries none
#   POST_DEPLOY_CHECK_URL        where to ask for the smoke checks after the
#                                deploy; unset, none are asked for
# npm needs no token: `@maxceem/agw` is published through npm trusted publishing,
# which authenticates this workflow file by OIDC and signs the provenance. Its
# trusted publisher names the `release` environment.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# Shared with the prices deploy (.github/workflows/deploy-prices.yml), so the
# two never deploy at once, and queued so neither replaces the other's pending run.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: github.repository == 'maxceem/app-ai-gateway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against the manifests and against main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          root=$(node -p "require('./package.json').version")
          cli=$(node -p "require('./cli/package.json').version")
          if [ "$version" != "$root" ] || [ "$version" != "$cli" ]; then
            echo "Tag $TAG names version $version, but package.json is $root and cli/package.json is $cli." >&2
            echo "A tag is only ever created by \`pnpm run release\`, which bumps both files in the commit it tags." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG points at $GITHUB_SHA, which is not on main. Releases are cut from main only." >&2
            exit 1
          fi

      # Installs the pnpm version pinned in packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  build:
    if: github.repository == 'maxceem/app-ai-gateway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prices_revision: ${{ steps.prices.outputs.revision }}
      prices_updated: ${{ steps.prices.outputs.updated }}
      # Every later job downloads exactly this upload, by its id, never a
      # same-named artifact from another job or run.
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0 # the price list's revision and day, from git history
          persist-credentials: false

      # Installs the pnpm version pinned in packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The price list this release carries, named in the post-deploy check.
      - name: Name the price list
        id: prices
        run: node scripts/prices-revision.mjs

      # The archive the CLI downloads and its integrity file, then the CLI
      # package that carries that digest (`prepack` checks it).
      - name: Build the gateway archive and the CLI package
        run: |
          set -euo pipefail
          node cli/scripts/release.mjs
          mkdir -p dist/npm
          (cd cli && npm pack --pack-destination ../dist/npm)

      - name: Build the hosted gateway
        run: node scripts/build-prebuilt.mjs dist/prebuilt

      - name: Build the documentation
        env:
          DOCS_SITE_SCRIPT: ${{ vars.DOCS_SITE_SCRIPT }}
        run: pnpm --filter @app-ai-gateway/docs static:build

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            cli/dist/gateway-*.tar.gz
            cli/dist/release-integrity.json
            dist/npm/
            dist/prebuilt/
            docs/out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The only job that waits for the owner's approval; every job after it runs
  # only once it succeeded.
  deploy-gateway:
    needs: [verify, build]
    if: github.repository == 'maxceem/app-ai-gateway'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # Into a directory of its own, never over the checkout: code that ran in
      # `build` could have put anything in the artifact, such as a changed
      # script. Only the expected built files are copied out, to paths the
      # checkout does not have, and a symbolic link stops the job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Take only the built gateway from the artifact
        env:
          FROM: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          if [ -n "$(find "$FROM" -type l)" ]; then
            echo "The build artifact contains symbolic links; not using it." >&2
            exit 1
          fi
          test ! -e dist || { echo "dist already exists in the checkout" >&2; exit 1; }
          mkdir -p dist/prebuilt/worker
          cp "$FROM/dist/prebuilt/worker/index.js" dist/prebuilt/worker/
          cp -R "$FROM/dist/prebuilt/console" dist/prebuilt/console

      # Only Wrangler and jsonc-parser, from deploy/'s lockfile, with no install
      # scripts and no cache another job could have written. Linked as the root
      # node_modules, where scripts/ resolves them.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the deploy tools
        run: |
          set -euo pipefail
          pnpm install --dir deploy --ignore-workspace --frozen-lockfile --ignore-scripts
          ln -s deploy/node_modules node_modules

      - name: Write the gateway's Cloudflare deployment profile
        env:
          WRANGLER_CLOUD_OVERLAY: ${{ secrets.WRANGLER_CLOUD_OVERLAY }}
        run: |
          set -euo pipefail
          test -n "$WRANGLER_CLOUD_OVERLAY" || { echo "WRANGLER_CLOUD_OVERLAY is missing" >&2; exit 1; }
          printf '%s\n' "$WRANGLER_CLOUD_OVERLAY" > wrangler.cloud.overlay.jsonc

      # Before anything is published: the overlay must suit the prebuilt
      # Worker (scripts/wrangler-config.mjs refuses one that changes how it is
      # built), which a dry run checks without contacting Cloudflare.
      - name: Check the deployment configuration
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/wrangler.mjs --profile cloud --prebuilt dist/prebuilt deploy --dry-run

      - name: Deploy the gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/deploy.mjs --profile cloud --prebuilt dist/prebuilt

      - name: Summarize
        env:
          TAG: ${{ github.ref_name }}
          PRICES_REVISION: ${{ needs.build.outputs.prices_revision }}
          PRICES_UPDATED: ${{ needs.build.outputs.prices_updated }}
        run: echo "Deployed ${TAG} with the price list from ${PRICES_REVISION} (${PRICES_UPDATED})." >> "$GITHUB_STEP_SUMMARY"

  # After the gateway, so a release whose gateway failed never changes the
  # docs. Its own environment, with no reviewer and a token that can edit only
  # the docs Worker, with no D1, R2 or gateway access: the approval for
  # `deploy-gateway` already covers it.
  deploy-docs:
    needs: [build, deploy-gateway]
    if: github.repository == 'maxceem/app-ai-gateway'
    runs-on: ubuntu-latest
    environment: docs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # As in deploy-gateway: into a directory of its own, and only the built
      # site is copied out.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Take only the built documentation from the artifact
        env:
          FROM: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          if [ -n "$(find "$FROM" -type l)" ]; then
            echo "The build artifact contains symbolic links; not using it." >&2
            exit 1
          fi
          test ! -e docs/out || { echo "docs/out already exists in the checkout" >&2; exit 1; }
          cp -R "$FROM/docs/out" docs/out

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the deploy tools
        run: |
          set -euo pipefail
          pnpm install --dir deploy --ignore-workspace --frozen-lockfile --ignore-scripts
          ln -s deploy/node_modules node_modules

      - name: Write the documentation's Cloudflare deployment profile
        env:
          DOCS_WRANGLER_CLOUD_OVERLAY: ${{ secrets.DOCS_WRANGLER_CLOUD_OVERLAY }}
        run: |
          set -euo pipefail
          test -n "$DOCS_WRANGLER_CLOUD_OVERLAY" || { echo "DOCS_WRANGLER_CLOUD_OVERLAY is missing" >&2; exit 1; }
          printf '%s\n' "$DOCS_WRANGLER_CLOUD_OVERLAY" > docs/wrangler.cloud.overlay.jsonc

      - name: Check the documentation's deployment configuration
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/wrangler.mjs --profile cloud --cwd docs deploy --dry-run

      # IndexNow: fingerprint the live docs before deploying, then submit the
      # pages the deploy added, changed or removed. Neither step fails the job.
      - name: Fingerprint the live documentation for IndexNow
        run: node docs/scripts/indexnow.mjs snapshot https://docs.appaigateway.com

      # The site `build` built into docs/out; docs/wrangler.jsonc serves it as
      # static assets.
      - name: Deploy the documentation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DOCS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/wrangler.mjs --profile cloud --cwd docs deploy

      - name: Submit the changed documentation pages to IndexNow
        run: node docs/scripts/indexnow.mjs submit https://docs.appaigateway.com docs/out

  publish-archive:
    needs: [build, deploy-gateway]
    if: github.repository == 'maxceem/app-ai-gateway'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the gateway archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0 # the previous release tag, for the release notes
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Take only the gateway archive from the artifact
        env:
          FROM: ${{ runner.temp }}/release
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -n "$(find "$FROM" -type l)" ]; then
            echo "The build artifact contains symbolic links; not using it." >&2
            exit 1
          fi
          test ! -e cli/dist || { echo "cli/dist already exists in the checkout" >&2; exit 1; }
          mkdir -p cli/dist
          cp "$FROM/cli/dist/gateway-${version}.tar.gz" "$FROM/cli/dist/release-integrity.json" cli/dist/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Publish the gateway archive to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node cli/scripts/publish-release.mjs --prebuilt

  # After the archive: an installed CLI refuses to run until it can download
  # exactly that archive.
  publish-npm:
    needs: [build, publish-archive]
    if: github.repository == 'maxceem/app-ai-gateway'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Take only the CLI package from the artifact
        env:
          FROM: ${{ runner.temp }}/release
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -n "$(find "$FROM" -type l)" ]; then
            echo "The build artifact contains symbolic links; not using it." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/npm"
          cp "$FROM/dist/npm/maxceem-agw-${version}.tgz" "$RUNNER_TEMP/npm/"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 still bundles 10.
      # Pinned, since it runs in this job. Provenance is generated by the OIDC
      # exchange itself, so no flag and no NPM_TOKEN are involved. The package
      # is the one `build` packed, published as is: no lifecycle script runs.
      - name: Publish the CLI to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@12.2.1
          npm --version
          version="${TAG#v}"
          if npm view "@maxceem/agw@${version}" version >/dev/null 2>&1; then
            echo "@maxceem/agw@${version} is already published; leaving it alone."
            exit 0
          fi
          npm publish "$RUNNER_TEMP/npm/maxceem-agw-${version}.tgz" --access public --ignore-scripts

  # Asks the outside monitor to run the smoke checks (smoke/) against what was
  # just deployed, the previous release's included. It reports the result
  # itself, so this only starts it, and never fails the release.
  post-deploy-check:
    needs: [build, deploy-gateway]
    if: github.repository == 'maxceem/app-ai-gateway' && vars.POST_DEPLOY_CHECK_URL != ''
    runs-on: ubuntu-latest
    environment: notify
    continue-on-error: true
    permissions: {}
    steps:
      - name: Start the post-deploy checks
        env:
          POST_DEPLOY_CHECK_URL: ${{ vars.POST_DEPLOY_CHECK_URL }}
          POST_DEPLOY_CHECK_TOKEN: ${{ secrets.POST_DEPLOY_CHECK_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRICES_REVISION: ${{ needs.build.outputs.prices_revision }}
          PRICES_UPDATED: ${{ needs.build.outputs.prices_updated }}
        run: |
          set -euo pipefail
          jq -nc --arg version "$TAG" --arg revision "$PRICES_REVISION" --arg updated "$PRICES_UPDATED" \
            '{version: $version, title: (if $revision == "" then $version else "\($version) with prices \($revision) (\($updated))" end)}' \
            > "$RUNNER_TEMP/announcement.json"
          printf 'Authorization: Bearer %s\n' "$POST_DEPLOY_CHECK_TOKEN" |
            curl --fail --silent --show-error --max-time 30 --header @- \
              --header 'Content-Type: application/json' \
              --data "@$RUNNER_TEMP/announcement.json" "$POST_DEPLOY_CHECK_URL"

  # After the gateway deploy: when main's price list moved on since the tag
  # (one merged while this release waited, or this is a run again after a
  # prices deploy), the gateway now runs an older one. Deploy main's on this
  # release, unless a newer release exists: running an older release again is
  # a rollback.
  follow-prices:
    needs: [build, deploy-gateway, deploy-docs, publish-archive, publish-npm]
    if: github.repository == 'maxceem/app-ai-gateway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # start a prices deploy when main's price list is newer than the tag's
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0 # the newest release tag and main's price list
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Deploy main's price list if it is newer
        env:
          GH_TOKEN: ${{ github.token }}
          PRICES_REVISION: ${{ needs.build.outputs.prices_revision }}
        run: node scripts/prices-deploy.mjs follow "$PRICES_REVISION"

  # Context7 serves the docs to coding agents from llms.txt and otherwise
  # re-reads them only every few weeks. Never fails the release.
  refresh-context7:
    needs: deploy-docs
    if: github.repository == 'maxceem/app-ai-gateway'
    runs-on: ubuntu-latest
    environment: notify
    continue-on-error: true
    permissions: {}
    steps:
      - name: Refresh the documentation on Context7
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "CONTEXT7_API_KEY is not set; skipping the Context7 refresh."
            exit 0
          fi
          curl -sS --fail-with-body -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -d '{"libraryName": "/llmstxt/appaigateway_llms_txt"}'
