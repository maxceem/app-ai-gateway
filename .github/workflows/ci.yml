# Checks and tests on every pull request and on main.
#
# `pull_request`, never `pull_request_target`: this runs a contributor's code,
# so it must run with their permissions and no repository secrets.
#
# The `versions` job is the other half of the release design. Releasing is
# triggered by a pushed `vX.Y.Z` tag (.github/workflows/release.yml) and the
# version fields are written only by `pnpm run release`, so a pull request that
# edits one cannot start a release — but it could leave main carrying a version
# no tag describes. This refuses that outright.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The daily model catalog pull request (.github/workflows/update-models.yml) is
  # opened with the default token, which starts no `pull_request` run; that
  # workflow dispatches this one on its branch instead, and `report` below puts
  # the result on the pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm run verify

      # Builds the Worker exactly as a deployment would, without an account or a
      # token: `--dry-run` never contacts Cloudflare.
      - run: pnpm run deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

  versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version fields against the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          node scripts/check-version-unchanged.mjs "origin/${BASE_REF}"

  # GitHub does not show the checks of a dispatched run on a pull request, so a
  # dispatched run reports its result as a commit status on the commit it
  # tested, which the pull request does show. A job of its own, so that the one
  # token allowed to write a status never runs the repository's code.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the result on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success) state=success; text="Checks and tests passed" ;;
            failure) state=failure; text="Checks or tests failed" ;;
            *) state=error; text="CI did not finish ($RESULT)" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="CI / verify" -f description="$text" -f target_url="$RUN_URL"
