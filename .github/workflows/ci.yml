# Checks and tests on every pull request and on main.
#
# `pull_request`, never `pull_request_target`: this runs a contributor's code,
# so it must run with their permissions and no repository secrets.
#
# The `versions` job is the other half of the release design. Releasing is
# triggered by a pushed `vX.Y.Z` tag (.github/workflows/release.yml) and the
# version fields are written only by `pnpm run release`, so a pull request that
# edits one cannot start a release — but it could leave main carrying a version
# no tag describes. This refuses that outright.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The test ledger records every test's result; a scheduled job outside
      # this repository reads the artifacts to find flaky, slow and idle tests.
      # See scripts/test-ledger/README.md.
      - run: pnpm run verify
        env:
          TEST_LEDGER_DIR: ${{ runner.temp }}/test-ledger
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-ledger
          path: ${{ runner.temp }}/test-ledger
          retention-days: 30
          if-no-files-found: ignore

      # Builds the Worker exactly as a deployment would, without an account or a
      # token: `--dry-run` never contacts Cloudflare.
      - run: pnpm run deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

      # The release deploys the hosted gateway prebuilt, from a job that installs
      # only deploy/ (from its own lockfile). Both would otherwise first fail
      # after the owner approved a release.
      - run: pnpm run deploy:prebuilt:dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Check the deploy tools install
        run: pnpm install --dir deploy --ignore-workspace --frozen-lockfile --ignore-scripts

  versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version fields against the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          node scripts/check-version-unchanged.mjs "origin/${BASE_REF}"

  # Price updates arrive as pull requests from the `app-ai-gateway-prices-bot`
  # GitHub App that change only src/usage/models.json, and a merged one goes
  # live without a release (.github/workflows/deploy-prices.yml). This holds
  # that author to that one file. It is a required check, so the job runs on
  # every pull request and always reports a result: its steps, not the job,
  # decide whether there is anything to check. It runs none of the pull
  # request's code, and fails if it cannot read the pull request's files.
  price-pr-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Not a price update
        if: github.event.pull_request.user.login != 'app-ai-gateway-prices-bot[bot]'
        run: echo "Not opened by the prices bot; nothing to check."

      - name: Check the price update changes only the price list
        if: github.event.pull_request.user.login == 'app-ai-gateway-prices-bot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Each file as a JSON array, which no file name can turn into a
          # workflow command when it is printed.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | [.status, .filename] | @json' > "$RUNNER_TEMP/files.txt"
          echo "Changed files:"
          cat "$RUNNER_TEMP/files.txt"
          if [ "$(cat "$RUNNER_TEMP/files.txt")" != '["modified","src/usage/models.json"]' ]; then
            echo "::error::A price update may change src/usage/models.json and nothing else."
            exit 1
          fi

      # The base branch's own code and price list, never the pull request's
      # code: only its price list is read, as data.
      - name: Check out the base branch
        if: github.event.pull_request.user.login == 'app-ai-gateway-prices-bot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check the price update removes no price
        if: github.event.pull_request.user.login == 'app-ai-gateway-prices-bot[bot]'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin "pull/${PR_NUMBER}/head"
          git show FETCH_HEAD:src/usage/models.json > "$RUNNER_TEMP/models.json"
          node scripts/check-price-removals.mjs src/usage/models.json "$RUNNER_TEMP/models.json"
