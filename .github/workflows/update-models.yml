# Checks every model in src/usage/models.json against its provider's pricing
# and deprecation pages once a day, and opens (or updates) one pull request
# when a current price changed or new models need review. New discoveries are
# recorded in notified.json; adding or skipping them is an explicit decision.
# Retirement dates accompany current price changes.
# Retirement-only changes and upcoming prices stay in the run summary.
# The rules — official page
# first, the two community lists only when they agree, nothing guessed — live
# in scripts/update-models.mjs.
#
# The pull request always comes from the branch `automation/update-models`, so
# there is one rolling pull request rather than one a day, and no diff means no
# pull request. The report is its body and this run's summary.
#
# The run ends red when something needs a person: a parser that no longer
# reads its page, lists that disagree, a suspicious move, a model gone from its
# official page. An item that is expected is acknowledged by adding its key and
# a reason to scripts/models/acknowledged.json.
#
# A pull request opened with the default token does not start `pull_request`
# workflows, so CI is dispatched on the branch by hand, and its checks attach
# to the pull request's head commit. That needs `actions: write`, and the
# repository setting "Allow GitHub Actions to create and approve pull requests"
# for the pull request itself.
name: Update models

on:
  schedule:
    - cron: "7 20 * * *" # daily at 20:07 UTC, off the hour
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'maxceem/app-ai-gateway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # The script uses nothing but Node's standard library, so nothing is
      # installed into a job that holds a write token.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check models
        id: models
        run: |
          set +e
          node scripts/update-models.mjs --report "$RUNNER_TEMP/models.md" --review "$RUNNER_TEMP/model-review.json"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/models.md" ]; then
            cat "$RUNNER_TEMP/models.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refresh the new model review issue
        id: review
        continue-on-error: true # An issue failure must not suppress a catalog-review PR.
        if: steps.models.outputs.code == '0' || steps.models.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/review-models.mjs publish "$RUNNER_TEMP/model-review.json"

      - name: Open or update the pull request
        id: pr
        if: steps.models.outputs.code == '0' || steps.models.outputs.code == '3'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-models
          base: main
          title: Update the model catalog
          commit-message: Update the model catalog
          body-path: ${{ runner.temp }}/models.md
          add-paths: |
            src/usage/models.json
            scripts/models/notified.json
          delete-branch: true

      - name: Run CI on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/update-models

      - name: Fail when something needs a person
        if: steps.models.outputs.code != '0' || steps.review.outcome == 'failure'
        env:
          CODE: ${{ steps.models.outputs.code }}
          REVIEW_RESULT: ${{ steps.review.outcome }}
        run: |
          if [ "$CODE" = "3" ]; then
            echo "::error::Some models need a person; see the run summary or the pull request."
          elif [ "$CODE" != "0" ]; then
            echo "::error::scripts/update-models.mjs failed (exit $CODE)."
          fi
          if [ "$REVIEW_RESULT" = "failure" ]; then
            echo "::error::The new model review issue could not be refreshed."
          fi
          exit 1
