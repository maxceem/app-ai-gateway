# Checks every model in src/usage/models.json against its provider's pricing
# and deprecation pages once a day, and opens (or updates) one pull request
# when a current price changed or new models need review. AI proposes add/skip
# choices; prices are parsed and validated in code. Comments override choices
# on the same PR, and merging applies them. No review issue is created.
# Retirement dates accompany current price changes.
# Retirement-only changes and upcoming prices stay in the run summary.
# The rules — official page
# first, the two community lists only when they agree, nothing guessed — live
# in scripts/update-models.mjs.
#
# The pull request always comes from the branch `automation/update-models`, so
# there is one rolling pull request rather than one a day, and no diff means no
# pull request. The report is its body and this run's summary.
#
# Something needs a person when a parser no longer reads its page, lists
# disagree, a price moves suspiciously or a model is gone from its official
# page. The pull request then carries it: its description lists it and a red
# "Model catalog" status marks it. Only when there is no pull request to carry
# it does the run itself end red. An item that is expected is acknowledged by
# adding its key and a reason to scripts/models/acknowledged.json.
#
# A pull request opened with the default token does not start `pull_request`
# workflows, so CI is dispatched on the branch by hand, and its checks attach
# to the pull request's head commit. That needs `actions: write`, and the
# repository setting "Allow GitHub Actions to create and approve pull requests"
# for the pull request itself.
name: Update models

on:
  schedule:
    - cron: "7 20 * * *" # daily at 20:07 UTC, off the hour
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
  statuses: write

jobs:
  update:
    if: github.repository == 'maxceem/app-ai-gateway'
    concurrency:
      group: model-catalog-sync
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # The script uses nothing but Node's standard library, so nothing is
      # installed into a job that holds a write token.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Preserve choices from the rolling PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/review-models.mjs load "$RUNNER_TEMP/model-review.json"

      - name: Check models
        id: models
        env:
          MODEL_REVIEW_API_KEY: ${{ secrets.MODEL_REVIEW_API_KEY }}
          MODEL_REVIEW_API_URL: ${{ vars.MODEL_REVIEW_API_URL }}
          MODEL_REVIEW_MODEL: ${{ vars.MODEL_REVIEW_MODEL }}
        run: |
          # One date for the prices and the title, even across midnight UTC.
          today=$(date -u +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          set +e
          node scripts/update-models.mjs --report "$RUNNER_TEMP/models.md" --review "$RUNNER_TEMP/model-review.json" --today "$today"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/models.md" ]; then
            cat "$RUNNER_TEMP/models.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the pull request
        id: pr
        if: steps.models.outputs.code == '0' || steps.models.outputs.code == '3'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-models
          base: main
          title: Update the model catalog (${{ steps.models.outputs.today }})
          commit-message: Update the model catalog (${{ steps.models.outputs.today }})
          body-path: ${{ runner.temp }}/models.md
          add-paths: |
            src/usage/models.json
            scripts/models/acknowledged.json
            scripts/models/review.json
          delete-branch: true

      - name: Run CI on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/update-models

      # The pull request is the notification: its description lists what needs
      # a person, and this status puts a red mark on it without failing the run.
      - name: Mark what needs your attention on the pull request
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.models.outputs.code }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$CODE" = "3" ]; then
            state=failure; text="Needs your attention: see the description"
          else
            state=success; text="Nothing needs your attention"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="Model catalog" -f description="$text" -f target_url="$RUN_URL"

      - name: Fail when something needs a person and no pull request shows it
        if: steps.models.outputs.code != '0' && steps.pr.outputs.pull-request-number == ''
        env:
          CODE: ${{ steps.models.outputs.code }}
        run: |
          if [ "$CODE" = "3" ]; then
            echo "::error::Some models need a person; see the run summary."
          elif [ "$CODE" != "0" ]; then
            echo "::error::scripts/update-models.mjs failed (exit $CODE)."
          fi
          exit 1
