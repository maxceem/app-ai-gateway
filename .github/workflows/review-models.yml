# Commands run only the scripts checked out from main. No PR/fork code or
# comment text is executed; current write access is checked through GitHub.
name: Review new models

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  decide:
    if: github.repository == 'maxceem/app-ai-gateway' && !github.event.issue.pull_request && github.event.issue.user.login == 'github-actions[bot]' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '/models ')
    concurrency:
      group: model-review-decisions
      cancel-in-progress: false
      # Queue comment batches instead of dropping all but the newest pending one.
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply explicit decisions
        id: decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/review-models.mjs prepare "$RUNNER_TEMP/model-decisions.md"
      - name: Open or update the decision PR
        id: pr
        if: steps.decisions.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ steps.decisions.outputs.branch }}
          base: main
          title: Apply model review decisions
          commit-message: Apply model review decisions
          body-path: ${{ runner.temp }}/model-decisions.md
          add-paths: |
            src/usage/models.json
            scripts/models/acknowledged.json
          delete-branch: true
      - name: Run CI on the decision PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.decisions.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: Link the decision PR in the review issue
        if: always() && steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: node scripts/review-models.mjs reply "$PR_URL"
