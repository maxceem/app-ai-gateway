# Deploys a merged model catalog without a release: the gateway release that is
# live, with only `src/usage/models.json` from main swapped in. The daily price
# pull request (.github/workflows/update-models.yml) then goes live, and so does
# the public `/models.json`, minutes after it merges. Nothing is published: no
# tag, GitHub release, npm package or documentation deploy.
#
# Two jobs, so that only released code ever holds the deploy secrets:
#   start   runs on main when a merge changes the catalog. It holds no secrets;
#           it starts this workflow again at the newest `vX.Y.Z` tag.
#   deploy  runs at that tag, so this file, scripts/catalog-deploy.mjs and the
#           Worker it builds are the tag's own, released code. It checks the tag
#           is the newest and its release succeeded, swaps in main's catalog,
#           runs the release's checks against it and deploys.
#
# The `catalog` environment holds the secrets. It must admit `v*` tags only,
# and only the project owner can create those (see release.yml), so neither a
# merged but unreleased change, nor a pull request, nor another branch reaches
# them. It has no required reviewer: merging the catalog change is the review.
# A change to this file takes effect with the next release. Secrets:
#   CLOUDFLARE_API_TOKEN      the same permissions the release's deploy uses
#   CLOUDFLARE_ACCOUNT_ID     the account the gateway Worker lives in
#   WRANGLER_CLOUD_OVERLAY    contents of wrangler.cloud.overlay.jsonc
#   POST_DEPLOY_CHECK_TOKEN   optional, as in .github/workflows/release.yml
name: Deploy the model catalog

on:
  push:
    branches: [main]
    paths: [src/usage/models.json]
  # Started by `start` below at a release tag, or by hand at one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start:
    if: github.repository == 'maxceem/app-ai-gateway' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # start this workflow at the release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/catalog-deploy.mjs start

  deploy:
    if: github.repository == 'maxceem/app-ai-gateway' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: catalog
    permissions:
      contents: read
      actions: read # the Release workflow's runs, to confirm the tag is live
    # Shared with release.yml, and queued rather than replaced, so a release and
    # a catalog deploy never deploy at the same time and neither drops the other.
    # Each run reads main's catalog when it starts, so the last one carries every
    # change before it.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main's history, for the day its catalog last changed
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the release and swap in main's catalog
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/catalog-deploy.mjs prepare

      # Installs the pnpm version pinned in packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The release's own checks, against the new catalog. A catalog that needs
      # code the release lacks, such as a new price field, fails here and waits
      # for the next release.
      - run: pnpm run verify

      - name: Write the Cloudflare deployment profile
        env:
          WRANGLER_CLOUD_OVERLAY: ${{ secrets.WRANGLER_CLOUD_OVERLAY }}
        run: |
          set -euo pipefail
          test -n "$WRANGLER_CLOUD_OVERLAY" || { echo "WRANGLER_CLOUD_OVERLAY is missing" >&2; exit 1; }
          printf '%s\n' "$WRANGLER_CLOUD_OVERLAY" > wrangler.cloud.overlay.jsonc

      - name: Deploy the gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          # Settings shows when the prices last changed: main's day, not the tag's.
          CATALOG_UPDATED: ${{ steps.plan.outputs.catalog_date }}
        run: pnpm run deploy --profile cloud

      - name: Start the post-deploy checks
        if: vars.POST_DEPLOY_CHECK_URL != ''
        continue-on-error: true
        env:
          POST_DEPLOY_CHECK_URL: ${{ vars.POST_DEPLOY_CHECK_URL }}
          POST_DEPLOY_CHECK_TOKEN: ${{ secrets.POST_DEPLOY_CHECK_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          printf 'Authorization: Bearer %s\n' "$POST_DEPLOY_CHECK_TOKEN" |
            curl --fail --silent --show-error --max-time 30 --header @- \
              --header 'Content-Type: application/json' \
              --data "{\"version\":\"${TAG}\"}" "$POST_DEPLOY_CHECK_URL"

      - name: Summarize
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          COMMIT: ${{ steps.plan.outputs.catalog_commit }}
          DATE: ${{ steps.plan.outputs.catalog_date }}
        run: echo "Deployed ${TAG} with the model catalog from ${COMMIT} (${DATE})." >> "$GITHUB_STEP_SUMMARY"
